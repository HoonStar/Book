<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        .btn-primary {
            background: theme('colors.active-gradient');
            transition: all 0.2s ease-in-out;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }
        .glass-input:focus-within {
            box-shadow: inset 0 0 0 1px theme('colors.primary');
        }

<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface relative overflow-hidden">
<!-- Abstract Background Element -->
<div class="absolute inset-0 pointer-events-none opacity-20" style="background: radial-gradient(circle at 50% 0%, theme('colors.primary-container') 0%, transparent 60%);"></div>
<main class="w-full max-w-md relative z-10 flex flex-col gap-stack-lg">
<!-- Header -->
<div class="text-center flex flex-col gap-stack-sm">
<div class="w-16 h-16 mx-auto bg-surface-charcoal rounded-xl border border-glass-border flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary tracking-tighter">Melody AI</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Your personalized AI music curator. Enter your API key to begin.</p>
</div>
<!-- Input Section -->
<form class="bg-surface-charcoal border border-glass-border rounded-xl p-stack-md flex flex-col gap-stack-md relative shadow-2xl backdrop-blur-xl">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest" for="api-key">OpenAI API Key</label>
<div class="relative flex items-center bg-surface border border-glass-border rounded-lg glass-input transition-shadow duration-200">
<span class="material-symbols-outlined text-on-surface-variant ml-4 mr-2 text-xl" style="font-variation-settings: 'FILL' 0;">key</span>
<input class="w-full bg-transparent border-none text-on-surface font-body-md focus:ring-0 px-2 py-3 placeholder:text-on-surface-variant/50" id="api-key" placeholder="sk-..." type="password"/>
<button aria-label="Toggle password visibility" class="p-3 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" id="toggle-visibility" type="button">
<span class="material-symbols-outlined" id="visibility-icon" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
<p class="font-body-md text-body-md text-on-surface-variant/70 text-xs mt-1">Your key is stored locally and never sent to our servers.</p>
</div>
<!-- Security Notice -->
<div class="bg-surface-container-high border border-glass-border rounded-lg p-4 flex gap-4 items-start">
<span class="material-symbols-outlined text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">lock</span>
<div class="flex flex-col gap-1">
<h3 class="font-headline-sm text-headline-sm text-on-surface text-sm">Secure Environment</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-xs">
                        {{DATA:DOCUMENT:DOCUMENT_1}}
                    </p>
</div>
</div>
<!-- Action -->
<button class="w-full btn-primary rounded-lg py-4 font-headline-sm text-headline-sm text-white flex items-center justify-center gap-2 mt-4" type="submit">
                Start Survey
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<div class="text-center mt-4">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors underline-offset-4 hover:underline text-sm" href="#">Where do I find my API key?</a>
</div>
</main>
<script>
        document.getElementById('toggle-visibility').addEventListener('click', function() {
            const input = document.getElementById('api-key');
            const icon = document.getElementById('visibility-icon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        });
    </script>
</body></html>
